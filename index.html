<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gästeliste Nicola & Vanessa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root {
  /* Layout: heller Kopf mit Namen, runde Zahlenleiste, Filter, dann weiche, ovale Kacheln */
  --bg: #F6F4F1;
  --surface: #FFFFFF;
  --sunk: #F3F1EE;
  --line: #E7E2DB;
  --ink: #2B2B2A;
  --muted: #7C7872;
  --accent: #587765;
  --on-accent: #FFFFFF;
  --inv: #4F78A3;
  --inv-bg: #E6EEF6;
  --yes: #3B7A58;
  --yes-bg: #E2F1E8;
  --no: #B0554A;
  --no-bg: #F9E4E0;
  --open: #DAD5CD;
  --kid: #94651C;
  --kid-bg: #FAEFD9;
  --note-bg: #FBF5E1;
  --note-ink: #6B5718;
  --shadow: 0 14px 36px rgba(60, 50, 40, 0.12);
  --soft: 0 1px 2px rgba(60, 50, 40, 0.05), 0 4px 14px rgba(60, 50, 40, 0.05);
  --veil: rgba(238, 234, 228, 0.38);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-line: rgba(255, 255, 255, 0.75);
  --glass-field: rgba(255, 255, 255, 0.55);
  --glass-shadow: 0 30px 80px rgba(60, 50, 40, 0.22);
  --display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713; --surface: #18211C; --sunk: #202B25; --line: #2E3C34;
    --ink: #E6EEE9; --muted: #97A99F; --accent: #7FC4A6; --on-accent: #0C1712;
    --inv: #8DB4E2; --inv-bg: #22364D; --yes: #6CCB97; --yes-bg: #1D3A2B; --no: #F0897D; --no-bg: #432421; --open: #4A5A51;
    --kid: #EBC474; --kid-bg: #3F3216; --note-bg: #352E1B; --note-ink: #E8D9A8; --shadow: 0 14px 36px rgba(0, 0, 0, 0.45); --soft: 0 1px 2px rgba(0,0,0,0.3); --veil: rgba(8, 12, 10, 0.45); --glass: rgba(30, 42, 36, 0.58); --glass-line: rgba(255, 255, 255, 0.14); --glass-field: rgba(255, 255, 255, 0.07); --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --surface: #18211C; --sunk: #202B25; --line: #2E3C34;
  --ink: #E6EEE9; --muted: #97A99F; --accent: #7FC4A6; --on-accent: #0C1712;
  --inv: #8DB4E2; --inv-bg: #22364D; --yes: #6CCB97; --yes-bg: #1D3A2B; --no: #F0897D; --no-bg: #432421; --open: #4A5A51;
  --kid: #EBC474; --kid-bg: #3F3216; --note-bg: #352E1B; --note-ink: #E8D9A8; --shadow: 0 14px 36px rgba(0, 0, 0, 0.45); --soft: 0 1px 2px rgba(0,0,0,0.3); --veil: rgba(8, 12, 10, 0.45); --glass: rgba(30, 42, 36, 0.58); --glass-line: rgba(255, 255, 255, 0.14); --glass-field: rgba(255, 255, 255, 0.07); --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { padding: 8px 0 4px; }
header .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 11vw, 80px); line-height: 0.98; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
header h1 em { font-style: italic; color: var(--accent); padding: 0 0.06em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stats { display: flex; flex-direction: column; }
.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
.big > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.big > div + div { border-left: 1px solid var(--line); }
.big .n { font-family: var(--display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.big .l { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.big .first { background: var(--accent); color: var(--on-accent); }
.big .first .l { color: var(--on-accent); opacity: 0.8; }
.big .first .n { font-size: 44px; }
.rows { margin: 0; border-top: 1px solid var(--line); padding: 2px 14px; font-size: 14px; }
.rows > div { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 0; }
.rows > div + div { border-top: 1px dashed var(--line); }
.rows dt { width: 92px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.rows .c { font-variant-numeric: tabular-nums; }
.rows .c b { font-weight: 700; margin-left: 4px; }
.foot { font-size: 12px; color: var(--muted); padding: 0 14px 8px; margin: 0; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { height: 40px; padding: 0 14px; border: 0; background: transparent; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn { height: 42px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--no); border-color: var(--no); background: transparent; }
.btn.danger.armed { background: var(--no); color: var(--surface); }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 34px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { margin-left: 5px; font-weight: 600; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] b { color: var(--on-accent); }
.legend { margin: -6px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.legend .dot { margin-left: 8px; }
.legend .dot:first-child { margin-left: 0; }
.notice { padding: 12px 14px; border-radius: 4px; background: var(--no-bg); color: var(--no); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

.place { display: flex; flex-direction: column; gap: 10px; }
.place + .place { margin-top: 10px; }
.place-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--accent); }
.place-head h2 { font-family: var(--display); font-weight: 400; font-size: 36px; margin: 0; line-height: 1.1; }
.place-head .cnt { color: var(--muted); font-size: 14px; }
.place-head .note-slot { flex: 1 1 100%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 8px; align-items: start; }

.card { overflow: hidden; }
.card-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px 8px; align-items: flex-start; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.card-head .count { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card-head .count b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
.note-slot { padding: 0 14px 8px; min-width: 0; }
.place-head .note-slot { padding: 0; }
.note-box, .note-add { display: block; width: 100%; text-align: left; border-radius: 6px; font-size: 13px; padding: 7px 10px; }
.note-box { border: 0; background: var(--note-bg); color: var(--note-ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-add { border: 0; background: transparent; color: var(--muted); padding: 0; width: auto; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }

.p { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 14px; border-top: 1px solid var(--line); }
.p-main { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.p-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; overflow-wrap: anywhere; }
.p-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; font-variant-numeric: tabular-nums; }
.p-note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.tag.kid { background: var(--kid-bg); color: var(--kid); border-color: transparent; }
.st { flex: 0 0 auto; width: 96px; height: 32px; border-radius: 4px; border: 1px dashed var(--line); background: transparent; font-size: 12px; font-weight: 600; color: var(--muted); }
.st[data-k="i"] { border: 1px solid transparent; color: var(--inv); background: var(--inv-bg); }
.st[data-k="y"] { border: 1px solid transparent; background: var(--yes-bg); color: var(--yes); }
.st[data-k="n"] { border: 1px solid transparent; background: var(--no-bg); color: var(--no); }


.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 0; min-width: 0; }
.tile.wide-tile { grid-column: 1 / -1; }
.tile { transition: border-color .12s, box-shadow .12s; }
.tile:hover { border-color: var(--accent); }
.tile.is-open { border-color: var(--accent); box-shadow: var(--shadow); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.dot { width: 8px; height: 8px; background: var(--open); }
.dot[data-k="i"] { background: var(--inv); }
.dot[data-k="y"] { background: var(--yes); }
.dot[data-k="n"] { background: var(--no); }
.t-head { display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; padding: 8px 4px 8px 10px; cursor: pointer; }
.t-main { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; }
.names { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
.names.wide { flex-direction: row; flex-wrap: wrap; gap: 2px 14px; }
.nm { border: 0; background: transparent; padding: 1px 0; text-align: left; font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.nm:hover { color: var(--accent); }
.addr { font-size: 11.5px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.chev { flex: 0 0 auto; width: 32px; height: 32px; border: 0; background: transparent; display: grid; place-items: center; }
.arr { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
.chev[aria-expanded="true"] .arr { transform: rotate(-135deg) translate(-2px, -2px); border-color: var(--accent); }
.t-body { border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.t-sum { font-size: 12px; color: var(--muted); }
.t-body .note-slot { padding: 0; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.d { background: var(--sunk); padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.d-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.d-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.d-line { font-size: 13px; display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.d-line .k { color: var(--muted); min-width: 66px; }
.d-note { font-size: 13px; color: var(--note-ink); background: var(--note-bg); padding: 5px 8px; overflow-wrap: anywhere; }
.edit-link { align-self: flex-start; border: 0; background: transparent; padding: 4px 0 0; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.veil { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 20, 0.55); display: flex; align-items: flex-end; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
  padding: 18px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .veil { align-items: center; } .sheet { border-radius: 8px; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label, .f .lab { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.f input[type="text"], .f input[type="number"], .f select, .f textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); min-height: 42px; }
.f textarea { resize: vertical; min-height: 84px; }
.two { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.actions .spacer { margin-right: auto; }
.err { color: var(--no); font-size: 13px; min-height: 18px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 32px); }
@media (max-width: 480px) { .rows dt { width: 100%; } .st { width: 84px; } }

/* weich, rund, leicht */
.panel { border-radius: 26px; }
.big { padding: 8px; gap: 6px; }
.big > div { border-radius: 20px; padding: 12px 16px; }
.big > div + div { border-left: 0; }
.big .first { border-radius: 20px; }
.rows { border-top: 0; padding: 0 22px 6px; }
.rows > div + div { border-top: 1px solid var(--line); }
.foot { padding: 0 22px 16px; }
header .eyebrow { font-weight: 500; letter-spacing: 0.22em; }
.search input { border-radius: 99px; padding: 0 20px; height: 46px; background: var(--surface); box-shadow: var(--soft); border-color: transparent; }
.seg { border-radius: 99px; padding: 3px; gap: 2px; border-color: transparent; box-shadow: var(--soft); }
.seg button { border-radius: 99px; height: 38px; padding: 0 18px; }
.seg button + button { border-left: 0; }
.btn { border-radius: 99px; height: 46px; padding: 0 22px; font-weight: 500; }
.btn.small { height: 36px; }
.chip { border-radius: 99px; height: 36px; padding: 0 15px; border-color: transparent; box-shadow: var(--soft); }
.chip[aria-pressed="true"] { box-shadow: none; }
.tile { border-radius: 26px; border-color: transparent; box-shadow: var(--soft); overflow: hidden; }
.tile:hover { border-color: var(--line); }
.tile.is-open { border-color: transparent; }
.grid { gap: 12px; }
.t-head { padding: 16px 10px 16px 20px; gap: 8px; }
.t-main { gap: 6px; }
.nm { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; padding: 1px 0; }
.addr { font-size: 12px; }
.chev { width: 34px; height: 34px; border-radius: 50%; background: var(--sunk); }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dots { gap: 4px; margin-top: 3px; }
.t-body { padding: 4px 16px 18px; border-top: 0; gap: 10px; }
.t-sum { padding-left: 4px; }
.d { border-radius: 20px; padding: 14px 16px; gap: 4px; background: var(--sunk); }
.d-name { font-family: var(--display); font-weight: 400; font-size: 22px; }
.d-note { border-radius: 14px; padding: 7px 12px; }
.note-box { border-radius: 14px; padding: 9px 14px; }
.st { border-radius: 99px; font-weight: 500; }
.edit-link { padding-top: 6px; }
.place-head { border-bottom: 1px solid var(--line); }
.place-head h2 { font-size: 40px; font-weight: 400; }
.notice, .empty.panel { border-radius: 20px; }
.sheet { border-radius: 30px 30px 0 0; padding: 22px 20px; }
@media (min-width: 700px) { .sheet { border-radius: 30px; } }
.f input[type="text"], .f input[type="number"], .f select, .f textarea { border-radius: 16px; border-color: var(--line); background: var(--sunk); padding: 10px 14px; }
.sheet h2 { font-size: 32px; }
.toast { border-radius: 99px; padding: 10px 20px; }

/* Spalten und Animation */
.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dgrid { grid-template-columns: 1fr; }
.wide-tile .dgrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.d-top { flex-wrap: wrap; }
.d-name { flex: 1 1 auto; }
.d-line { flex-wrap: wrap; gap: 0 8px; }
.tile { transition: box-shadow .35s ease, transform .35s cubic-bezier(.22, .8, .24, 1), border-color .2s; }
@media (hover: hover) { .tile:hover { transform: translateY(-2px); } }
.t-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.22, .8, .24, 1); }
.tile.is-open > .t-collapse { grid-template-rows: 1fr; }
.t-inner { min-height: 0; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .4s; }
.tile.is-open > .t-collapse > .t-inner { opacity: 1; visibility: visible; transition: opacity .4s ease .1s, visibility 0s; }
.chev { transition: background .25s ease; }
.chev[aria-expanded="true"] { background: var(--accent); }
.chev[aria-expanded="true"] .arr { border-color: var(--on-accent); }
.arr { transition: transform .4s cubic-bezier(.22, .8, .24, 1), border-color .25s; }
.st, .chip, .btn, .seg button { transition: background .2s ease, color .2s ease, transform .15s ease; }
.st:active, .chip:active, .btn:active { transform: scale(0.96); }
@keyframes swap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#list.swap { animation: swap-in .4s cubic-bezier(.22, .8, .24, 1) both; }
@keyframes veil-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes veil-out { to { opacity: 0; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(28px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(18px) scale(0.98); } }
.veil { animation: veil-in .25s ease both; }
.sheet { animation: sheet-in .35s cubic-bezier(.22, .8, .24, 1) both; }
.veil.out { animation: veil-out .19s ease both; pointer-events: none; }
.veil.out .sheet { animation: sheet-out .19s ease both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
}

/* Glas-Popup für die Haushalts-Details */
.veil.glass { align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: transparent; }
.veil.glass::before { content: ""; position: absolute; inset: 0; background: var(--veil); -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15); }
.veil.glass .sheet { position: relative; z-index: 1; max-width: 840px; max-height: min(100%, 900px); border-radius: 36px; padding: 30px 28px; gap: 18px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-line);
  animation: pop-in .55s cubic-bezier(.34, 1.45, .5, 1) both; }
.veil.glass.out .sheet { animation: pop-out .2s ease both; }
@keyframes pop-in { from { opacity: 0; transform: translateY(24px) scale(0.72); } to { opacity: 1; transform: none; } }

.pop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.pop-sub { margin-top: 6px; color: var(--muted); font-size: 14px; }
.x { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass-field); font-size: 24px; line-height: 1; display: grid; place-items: center; padding-bottom: 3px; }
.pop .dgrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.pop .d { background: var(--glass-field); border: 1px solid var(--glass-line); padding: 16px 18px; }
.pop .note-slot { padding: 0; }
@media (max-width: 639px) { .veil.glass .sheet { padding: 24px 18px; border-radius: 30px; } .pop-title { font-size: 36px; } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .veil.glass::before { background: rgba(20, 24, 22, 0.5); }
  .veil.glass .sheet { background: var(--surface); }
}
/* Popup: deckend, nur der Hintergrund bleibt unscharf */
.veil.glass .sheet { background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: var(--shadow); }
.pop .d { background: var(--sunk); border: 0; }
.x { background: var(--sunk); border-color: transparent; }

/* Budget */
[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.view.swap, #b-list.swap { animation: swap-in .4s cubic-bezier(.22, .8, .24, 1) both; }
.modes { display: flex; }
.seg.big { padding: 4px; }
.seg.big button { height: 46px; padding: 0 30px; font-size: 16px; font-weight: 600; }
.mny small { font-size: 0.55em; opacity: 0.7; margin-left: 1px; }
.link { border: 0; background: transparent; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.two.eq { grid-template-columns: 1fr 1fr; }
.hint { margin: 0; flex: 1 1 240px; font-size: 13px; color: var(--muted); }
.cap { font-size: 12.5px; color: var(--muted); }
.vd { padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; }
.vd.ok { background: var(--yes-bg); color: var(--yes); }
.vd.warn { background: var(--no-bg); color: var(--no); }

.b-hero { display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: flex-end; justify-content: space-between; padding: 24px 24px 10px; }
.b-hero .l { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.b-big { display: block; font-family: var(--display); font-size: clamp(54px, 13vw, 88px); line-height: 1; margin-top: 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
.b-big .mny small { font-size: 0.4em; }
.b-side { display: flex; flex-wrap: wrap; gap: 14px 32px; }
.b-side > div { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.b-side .v { font-family: var(--display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.prog { padding: 14px 24px 4px; display: flex; flex-direction: column; gap: 8px; }
.prog-l { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 13px; color: var(--muted); }
.prog-l span:first-child { color: var(--ink); font-weight: 600; }
.track { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .9s cubic-bezier(.22, .8, .24, 1); }
.b-verdict { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 24px 22px; font-size: 14px; }
.b-verdict b { font-weight: 700; margin-left: 4px; }

#b-list { display: flex; flex-direction: column; gap: 12px; }
.b-sec { display: flex; flex-direction: column; }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px; width: 100%; border: 0; background: transparent; text-align: left; color: var(--ink); }
.sec-head h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; margin: 0; }
.sec-head .cnt { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.sec-head .sum { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.sec-head.toggle { cursor: pointer; }
.caret { width: 32px; height: 32px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; flex: 0 0 auto; transition: background .25s ease; }
.toggle[aria-expanded="true"] .caret { background: var(--accent); }
.toggle[aria-expanded="true"] .arr { transform: rotate(-135deg) translate(-2px, -2px); border-color: var(--on-accent); }
.sec-empty { padding: 2px 20px 22px; color: var(--muted); }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.22, .8, .24, 1); }
.fold.is-open { grid-template-rows: 1fr; }
.fold-in { min-height: 0; overflow: hidden; }

.b-item { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); cursor: pointer; transition: background .2s ease; }
.b-item:hover { background: var(--sunk); }
.b-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.b-name { border: 0; background: transparent; padding: 0; text-align: left; font-family: var(--display); font-size: 21px; line-height: 1.2; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; overflow-wrap: anywhere; min-width: 0; color: var(--ink); }
.b-name .tag { font-family: var(--body); }
.b-sub2 { font-size: 12.5px; color: var(--muted); }
.b-amt { flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.b-item.done .b-name, .b-item.done .b-amt { color: var(--muted); }
.check { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--open); background: transparent; position: relative; transition: background .2s ease, border-color .2s ease, transform .15s ease; }
.check:hover { border-color: var(--accent); }
.check:active { transform: scale(0.9); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check .tick { position: absolute; left: 9px; top: 4px; width: 7px; height: 13px; border-right: 2.5px solid var(--on-accent); border-bottom: 2.5px solid var(--on-accent); transform: rotate(45deg) scale(0); transition: transform .22s cubic-bezier(.34, 1.45, .5, 1); }
.check.on .tick { transform: rotate(45deg) scale(1); }
@media (max-width: 480px) { .b-hero { padding: 20px 18px 8px; } .prog, .b-verdict { padding-left: 18px; padding-right: 18px; } .b-item, .sec-head { padding-left: 16px; padding-right: 16px; } .seg.big button { padding: 0 24px; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Hochzeit · Gästeliste</p>
    <h1>Nicola <em>&amp;</em> Vanessa</h1>
  </header>
  <div class="modes"><div class="seg big" role="group" aria-label="Bereich">
    <button type="button" id="m-gaeste" aria-pressed="true">Gäste</button>
    <button type="button" id="m-budget" aria-pressed="false">Budget</button>
  </div></div>
  <div id="notice" class="notice" hidden></div>
  <div class="view" id="gaeste-view">
  <section class="panel stats" id="stats" aria-label="Zahlen"></section>
  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="Suchen: Name, Ort, Notiz …" autocomplete="off"></div>
    <div class="seg" role="group" aria-label="Gruppierung">
      <button type="button" id="v-haushalt" aria-pressed="true">Haushalte</button>
      <button type="button" id="v-ort" aria-pressed="false">Orte</button>
    </div>
    <button type="button" class="btn primary" id="add">Person hinzufügen</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter"></div>
  <p class="legend" aria-hidden="true"><span class="dot"></span>Offen <span class="dot" data-k="i"></span>Eingeladen <span class="dot" data-k="y"></span>Zusage <span class="dot" data-k="n"></span>Absage</p>
  <main id="list"></main>
  </div>
  <div class="view" id="budget-view" hidden>
    <section class="panel stats" id="b-stats" aria-label="Budget"></section>
    <div class="bar">
      <p class="hint">Kreis antippen, wenn ein Posten bezahlt ist. Auf den Namen tippen zum Bearbeiten.</p>
      <button type="button" class="btn primary" id="b-add">Posten hinzufügen</button>
    </div>
    <main id="b-list"></main>
  </div>
</div>
<div id="layer"></div>

<script>
(function () {
  var ACCESS = ['Trauzeuge', 'Standesamt', 'Apero', 'Essen'];
  var guests = [], notes = {}, loaded = false, view = 'haushalt', q = '', filter = 'all', db = null;
  var budget = [], cfg = { hochzeit: 0, gesamt: 0 }, bLoaded = false, bfilter = 'all', mode = 'gaeste';
  try { var sv = localStorage.getItem('gl-view'); if (sv === 'ort' || sv === 'haushalt') view = sv; } catch (e) {}
  try { if (localStorage.getItem('gl-mode') === 'budget') mode = 'budget'; } catch (e) {}

  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'for') e.htmlFor = v;
      else if (k.slice(0, 2) === 'on') e[k] = v;
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        e.append(c.nodeType ? c : String(c));
      });
    }
    return e;
  }
  function put(el, kids) { el.replaceChildren.apply(el, [].concat(kids)); }
  function slug(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 120);
  }
  function persons(g) { return 1 + (Number(g.plus) || 0); }
  function sum(list) { return list.reduce(function (s, g) { return s + persons(g); }, 0); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
  function hasStreet(g) { return !!(g.street && g.street.trim()); }
  function hhKey(g) { return hasStreet(g) ? 'h-' + slug(g.street + ' ' + (g.zip || '') + ' ' + (g.city || '')) : 'p-none'; }
  function placeKey(g) { return g.city && g.city.trim() ? 'o-' + slug(g.city) : 'o-ohne'; }
  function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }

  var chain = {};
  function write(id, fn) {
    chain[id] = (chain[id] || Promise.resolve()).then(fn).catch(function () { toast('Speichern hat nicht geklappt.'); });
    return chain[id];
  }
  var toastTimer;
  function toast(msg) {
    var old = document.getElementById('toast'); if (old) old.remove();
    var t = h('div', { class: 'toast', id: 'toast', role: 'status', text: msg });
    document.body.append(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 2800);
  }

  /* ---------- Zahlen ---------- */
  function renderStats() {
    var total = sum(guests);
    var kids = sum(guests.filter(function (g) { return g.child; }));
    var hh = {}, loose = 0, places = {};
    guests.forEach(function (g) {
      if (hasStreet(g)) hh[hhKey(g)] = 1; else loose += 1;
      if (g.city && g.city.trim()) places[placeKey(g)] = 1;
    });
    var households = Object.keys(hh).length + loose;
    function ev(tag) { return sum(guests.filter(function (g) { return (g.access || []).indexOf(tag) > -1 || (g.access || []).indexOf('Trauzeuge') > -1; })); }
    var inv = sum(guests.filter(function (g) { return g.invited; }));
    var yes = sum(guests.filter(function (g) { return g.yes; }));
    var no = sum(guests.filter(function (g) { return g.no; }));
    function cell(n, l, cls) { return h('div', { class: cls || '' }, h('span', { class: 'n', text: String(n) }), h('span', { class: 'l', text: l })); }
    function chip(l, n) { return h('span', { class: 'c' }, l, h('b', { text: String(n) })); }
    var s = document.getElementById('stats');
    s.replaceChildren(
      h('div', { class: 'big' },
        cell(total, 'Personen', 'first'), cell(total - kids, 'Erwachsene'), cell(kids, 'Kinder'),
        cell(households, 'Haushalte'), cell(Object.keys(places).length, 'Orte')),
      h('dl', { class: 'rows' },
        h('div', null, h('dt', { text: 'Programm' }), h('dd', null, chip('Standesamt', ev('Standesamt')), chip('Apero', ev('Apero')), chip('Essen', ev('Essen')))),
        h('div', null, h('dt', { text: 'Rückmeldung' }), h('dd', null, chip('Eingeladen', inv), chip('Zusagen', yes), chip('Absagen', no), chip('Offen', Math.max(0, total - yes - no))))),
      h('p', { class: 'foot', text: 'Trauzeugen zählen bei jedem Programmpunkt mit. „+1“ zählt als weitere erwachsene Person.' })
    );
  }

  /* ---------- Liste ---------- */
  function matches(g) {
    if (!q) return true;
    var hay = [g.name, g.phone, g.note, g.street, g.zip, g.city, (g.access || []).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q) > -1;
  }
  var STATE_LABEL = { o: 'Offen', i: 'Eingeladen', y: 'Zusage', n: 'Absage' };
  var STATE_NEXT = { o: 'i', i: 'y', y: 'n', n: 'o' };
  var STATE_PATCH = {
    o: { invited: false, yes: false, no: false }, i: { invited: true, yes: false, no: false },
    y: { invited: true, yes: true, no: false }, n: { invited: true, yes: false, no: true }
  };
  function stateOf(g) { return g.yes ? 'y' : g.no ? 'n' : g.invited ? 'i' : 'o'; }
  function accessLabel(g) {
    var a = g.access || [];
    if (a.indexOf('Trauzeuge') > -1) return 'Trauzeuge';
    if (a.length === 3 || !a.length) return '';
    return a.join(' + ');
  }
  function statusBtn(g) {
    var s0 = stateOf(g);
    return h('button', { type: 'button', class: 'st', 'data-k': s0, title: 'Tippen zum Weiterschalten', text: STATE_LABEL[s0],
      onclick: function () { write(g.id, function () { return db.collection('guests').doc(g.id).update(STATE_PATCH[STATE_NEXT[s0]]); }); } });
  }
  function detailRow(g) {
    var acc = (g.access || []).length ? g.access.join(', ') : 'nichts ausgewählt';
    return h('div', { class: 'd' },
      h('div', { class: 'd-top' },
        h('span', { class: 'd-name' }, g.name,
          g.child ? h('span', { class: 'tag kid', text: 'Kind' }) : null,
          g.plus ? h('span', { class: 'tag', text: '+' + g.plus }) : null),
        statusBtn(g)),
      h('div', { class: 'd-line' }, h('span', { class: 'k', text: 'Dabei bei' }), acc),
      g.phone ? h('div', { class: 'd-line' }, h('span', { class: 'k', text: 'Telefon' }), g.phone) : null,
      g.note ? h('div', { class: 'd-note', text: g.note }) : null,
      h('button', { type: 'button', class: 'edit-link', onclick: function () { openGuest(g, true); }, text: 'Bearbeiten' }));
  }
  function noteSlot(key, title, fromPopup) {
    var t = notes[key];
    return h('div', { class: 'note-slot' },
      t ? h('button', { type: 'button', class: 'note-box', onclick: function () { openNote(key, title, fromPopup); }, text: t })
        : h('button', { type: 'button', class: 'note-add', onclick: function () { openNote(key, title, fromPopup); }, text: '+ Bemerkung zur Gruppe' }));
  }
  function countLabel(list) {
    var p = sum(list), k = sum(list.filter(function (g) { return g.child; }));
    return { p: p, k: k };
  }
  function householdCard(grp) {
    var list = grp.guests.slice().sort(byOrder);
    function pop() { openPopup(grp.key); }
    var addr = grp.loose ? 'Ohne Adresse' : [grp.title, grp.sub].filter(Boolean).join(', ');
    var names = list.map(function (g) {
      return h('button', { type: 'button', class: 'nm', title: 'Bearbeiten', onclick: function (e) { e.stopPropagation(); openGuest(g); }, text: g.name });
    });
    var chev = h('button', { type: 'button', class: 'chev', 'aria-haspopup': 'dialog', 'aria-label': 'Details öffnen',
      onclick: function (e) { e.stopPropagation(); pop(); } }, h('span', { class: 'arr' }));
    var head = h('div', { class: 't-head', onclick: pop },
      h('div', { class: 't-main' },
        h('div', { class: 'names' + (grp.loose ? ' wide' : '') }, names),
        h('div', { class: 'addr', text: addr }),
        h('div', { class: 'dots', 'aria-hidden': 'true' }, list.map(function (g) { return h('span', { class: 'dot', 'data-k': stateOf(g), title: g.name + ': ' + STATE_LABEL[stateOf(g)] }); }))),
      chev);
    return h('article', { class: 'tile' + (grp.loose ? ' wide-tile' : '') }, head);
  }
  function households(list) {
    var map = {};
    list.forEach(function (g) {
      var k = hhKey(g);
      if (!map[k]) map[k] = { key: k, guests: [], title: hasStreet(g) ? g.street : 'Ohne Adresse',
        sub: hasStreet(g) ? [g.zip, g.city].filter(Boolean).join(' ') : 'Einladung persönlich oder Adresse fehlt', loose: !hasStreet(g) };
      map[k].guests.push(g);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      if (a.loose !== b.loose) return a.loose ? 1 : -1;
      return Math.min.apply(null, a.guests.map(function (g) { return g.order || 0; })) - Math.min.apply(null, b.guests.map(function (g) { return g.order || 0; }));
    });
  }
  function passes(g) {
    if (filter === 'kids') return !!g.child;
    if (filter === 'all') return true;
    return stateOf(g) === filter;
  }
  function renderChips() {
    var defs = [['all', 'Alle'], ['o', 'Offen'], ['i', 'Eingeladen'], ['y', 'Zusage'], ['n', 'Absage'], ['kids', 'Kinder']];
    put(document.getElementById('chips'), defs.map(function (d) {
      var n = sum(guests.filter(function (g) { return d[0] === 'all' ? true : d[0] === 'kids' ? g.child : stateOf(g) === d[0]; }));
      return h('button', { type: 'button', class: 'chip', 'aria-pressed': String(filter === d[0]), onclick: function () { filter = d[0]; renderChips(); renderList(); swapAnim(); } }, d[1], h('b', { text: String(n) }));
    }));
  }
  function renderList() {
    var el = document.getElementById('list');
    if (!loaded) { el.replaceChildren(h('div', { class: 'panel empty', text: 'Gästeliste wird geladen …' })); return; }
    if (!guests.length) {
      el.replaceChildren(h('div', { class: 'panel empty' }, h('span', { text: 'Noch keine Gäste eingetragen.' }),
        h('button', { type: 'button', class: 'btn primary', onclick: function () { openGuest(null); }, text: 'Erste Person hinzufügen' })));
      return;
    }
    var visible = guests.filter(function (g) { return matches(g) && passes(g); });
    var groups = households(visible);
    if (!groups.length) { el.replaceChildren(h('div', { class: 'panel empty', text: 'Keine Treffer.' })); return; }
    if (view === 'haushalt') {
      el.replaceChildren(h('div', { class: 'grid' }, groups.map(householdCard)));
      return;
    }
    var places = {};
    groups.forEach(function (grp) {
      var g0 = grp.guests[0], pk = placeKey(g0);
      if (!places[pk]) places[pk] = { key: pk, name: g0.city && g0.city.trim() ? g0.city : 'Ort offen', zip: g0.zip, groups: [] };
      places[pk].groups.push(grp);
    });
    var list = Object.keys(places).map(function (k) { return places[k]; }).sort(function (a, b) {
      if (a.key === 'o-ohne') return 1; if (b.key === 'o-ohne') return -1;
      return a.name.localeCompare(b.name, 'de');
    });
    put(el, list.map(function (pl) {
      var all = visible.filter(function (g) { return placeKey(g) === pl.key; });
      var c = countLabel(all);
      return h('section', { class: 'place' },
        h('div', { class: 'place-head' },
          h('h2', { text: pl.name }),
          h('span', { class: 'cnt', text: plural(c.p, 'Person', 'Personen') + (c.k ? ', ' + plural(c.k, 'Kind', 'Kinder') : '') + ' · ' + plural(pl.groups.length, 'Haushalt', 'Haushalte') }),
          noteSlot(pl.key, pl.name)),
        h('div', { class: 'grid' }, pl.groups.map(householdCard)));
    }));
  }
  function render() {
    renderStats(); renderChips(); renderList(); renderBudget();
    if (popupKey) {
      var sh = document.querySelector('.sheet.pop');
      if (sh) { var grp = groupByKey(popupKey); if (grp) fillPopup(sh, grp); else closeSheet(); }
    }
  }

  /* ---------- Fenster ---------- */
  var layer = document.getElementById('layer'), lastFocus = null;
  var popupKey = null;
  function openSheet(node, opts) {
    opts = opts || {};
    lastFocus = document.activeElement;
    var veil = h('div', { class: 'veil' + (opts.glass ? ' glass' : ''), onclick: function (e) { if (e.target === veil) closeSheet(); } }, node);
    if (opts.popup) veil.setAttribute('data-popup', '1');
    if (opts.back) veil.setAttribute('data-back', opts.back);
