<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gästeliste Nicola & Vanessa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root {
  /* Layout: heller Kopf mit Namen, runde Zahlenleiste, Filter, dann weiche, ovale Kacheln */
  --bg: #F6F4F1;
  --surface: #FFFFFF;
  --sunk: #F3F1EE;
  --line: #E7E2DB;
  --ink: #2B2B2A;
  --muted: #7C7872;
  --accent: #587765;
  --on-accent: #FFFFFF;
  --inv: #4F78A3;
  --inv-bg: #E6EEF6;
  --yes: #3B7A58;
  --yes-bg: #E2F1E8;
  --no: #B0554A;
  --no-bg: #F9E4E0;
  --open: #DAD5CD;
  --kid: #94651C;
  --kid-bg: #FAEFD9;
  --note-bg: #FBF5E1;
  --note-ink: #6B5718;
  --shadow: 0 14px 36px rgba(60, 50, 40, 0.12);
  --soft: 0 1px 2px rgba(60, 50, 40, 0.05), 0 4px 14px rgba(60, 50, 40, 0.05);
  --veil: rgba(238, 234, 228, 0.38);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-line: rgba(255, 255, 255, 0.75);
  --glass-field: rgba(255, 255, 255, 0.55);
  --glass-shadow: 0 30px 80px rgba(60, 50, 40, 0.22);
  --display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713; --surface: #18211C; --sunk: #202B25; --line: #2E3C34;
    --ink: #E6EEE9; --muted: #97A99F; --accent: #7FC4A6; --on-accent: #0C1712;
    --inv: #8DB4E2; --inv-bg: #22364D; --yes: #6CCB97; --yes-bg: #1D3A2B; --no: #F0897D; --no-bg: #432421; --open: #4A5A51;
    --kid: #EBC474; --kid-bg: #3F3216; --note-bg: #352E1B; --note-ink: #E8D9A8; --shadow: 0 14px 36px rgba(0, 0, 0, 0.45); --soft: 0 1px 2px rgba(0,0,0,0.3); --veil: rgba(8, 12, 10, 0.45); --glass: rgba(30, 42, 36, 0.58); --glass-line: rgba(255, 255, 255, 0.14); --glass-field: rgba(255, 255, 255, 0.07); --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --surface: #18211C; --sunk: #202B25; --line: #2E3C34;
  --ink: #E6EEE9; --muted: #97A99F; --accent: #7FC4A6; --on-accent: #0C1712;
  --inv: #8DB4E2; --inv-bg: #22364D; --yes: #6CCB97; --yes-bg: #1D3A2B; --no: #F0897D; --no-bg: #432421; --open: #4A5A51;
  --kid: #EBC474; --kid-bg: #3F3216; --note-bg: #352E1B; --note-ink: #E8D9A8; --shadow: 0 14px 36px rgba(0, 0, 0, 0.45); --soft: 0 1px 2px rgba(0,0,0,0.3); --veil: rgba(8, 12, 10, 0.45); --glass: rgba(30, 42, 36, 0.58); --glass-line: rgba(255, 255, 255, 0.14); --glass-field: rgba(255, 255, 255, 0.07); --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { padding: 8px 0 4px; }
header .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 11vw, 80px); line-height: 0.98; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
header h1 em { font-style: italic; color: var(--accent); padding: 0 0.06em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stats { display: flex; flex-direction: column; }
.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
.big > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.big > div + div { border-left: 1px solid var(--line); }
.big .n { font-family: var(--display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.big .l { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.big .first { background: var(--accent); color: var(--on-accent); }
.big .first .l { color: var(--on-accent); opacity: 0.8; }
.big .first .n { font-size: 44px; }
.rows { margin: 0; border-top: 1px solid var(--line); padding: 2px 14px; font-size: 14px; }
.rows > div { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 0; }
.rows > div + div { border-top: 1px dashed var(--line); }
.rows dt { width: 92px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.rows .c { font-variant-numeric: tabular-nums; }
.rows .c b { font-weight: 700; margin-left: 4px; }
.foot { font-size: 12px; color: var(--muted); padding: 0 14px 8px; margin: 0; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { height: 40px; padding: 0 14px; border: 0; background: transparent; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn { height: 42px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--no); border-color: var(--no); background: transparent; }
.btn.danger.armed { background: var(--no); color: var(--surface); }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 34px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { flex-direction: column; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.chip b { margin-left: 5px; font-weight: 600; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] b { color: var(--on-accent); }
.legend { margin: -6px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.legend .dot { margin-left: 8px; }
.legend .dot:first-child { margin-left: 0; }
.notice { padding: 12px 14px; border-radius: 4px; background: var(--no-bg); color: var(--no); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

.place { display: flex; flex-direction: column; gap: 10px; }
.place + .place { margin-top: 10px; }
.place-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--accent); }
.place-head h2 { font-family: var(--display); font-weight: 400; font-size: 36px; margin: 0; line-height: 1.1; }
.place-head .cnt { color: var(--muted); font-size: 14px; }
.place-head .note-slot { flex: 1 1 100%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 8px; align-items: start; }

.card { overflow: hidden; }
.card-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px 8px; align-items: flex-start; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.card-head .count { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card-head .count b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
.note-slot { padding: 0 14px 8px; min-width: 0; }
.place-head .note-slot { padding: 0; }
.note-box, .note-add { display: block; width: 100%; text-align: left; border-radius: 6px; font-size: 13px; padding: 7px 10px; }
.note-box { border: 0; background: var(--note-bg); color: var(--note-ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-add { border: 0; background: transparent; color: var(--muted); padding: 0; width: auto; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }

.p { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 14px; border-top: 1px solid var(--line); }
.p-main { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.p-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; overflow-wrap: anywhere; }
.p-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; font-variant-numeric: tabular-nums; }
.p-note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.tag.kid { background: var(--kid-bg); color: var(--kid); border-color: transparent; }
.st { flex: 0 0 auto; width: 96px; height: 32px; border-radius: 4px; border: 1px dashed var(--line); background: transparent; font-size: 12px; font-weight: 600; color: var(--muted); }
.st[data-k="i"] { border: 1px solid transparent; color: var(--inv); background: var(--inv-bg); }
.st[data-k="y"] { border: 1px solid transparent; background: var(--yes-bg); color: var(--yes); }
.st[data-k="n"] { border: 1px solid transparent; background: var(--no-bg); color: var(--no); }


.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 0; min-width: 0; }
.tile.wide-tile { grid-column: 1 / -1; }
.tile { transition: border-color .12s, box-shadow .12s; }
.tile:hover { border-color: var(--accent); }
.tile.is-open { border-color: var(--accent); box-shadow: var(--shadow); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.dot { width: 8px; height: 8px; background: var(--open); }
.dot[data-k="i"] { background: var(--inv); }
.dot[data-k="y"] { background: var(--yes); }
.dot[data-k="n"] { background: var(--no); }
.t-head { display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; padding: 8px 4px 8px 10px; cursor: pointer; }
.t-main { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; }
.names { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
.names.wide { flex-direction: row; flex-wrap: wrap; gap: 2px 14px; }
.nm { border: 0; background: transparent; padding: 1px 0; text-align: left; font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.nm:hover { color: var(--accent); }
.addr { font-size: 11.5px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.chev { flex: 0 0 auto; width: 32px; height: 32px; border: 0; background: transparent; display: grid; place-items: center; }
.arr { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
.chev[aria-expanded="true"] .arr { transform: rotate(-135deg) translate(-2px, -2px); border-color: var(--accent); }
.t-body { border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.t-sum { font-size: 12px; color: var(--muted); }
.t-body .note-slot { padding: 0; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.d { background: var(--sunk); padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.d-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.d-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.d-line { font-size: 13px; display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.d-line .k { color: var(--muted); min-width: 66px; }
.d-note { font-size: 13px; color: var(--note-ink); background: var(--note-bg); padding: 5px 8px; overflow-wrap: anywhere; }
.edit-link { align-self: flex-start; border: 0; background: transparent; padding: 4px 0 0; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.veil { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 20, 0.55); display: flex; align-items: flex-end; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
  padding: 18px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .veil { align-items: center; } .sheet { border-radius: 8px; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label, .f .lab { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.f input[type="text"], .f input[type="number"], .f input[type="email"], .f input[type="password"], .f select, .f textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); min-height: 42px; }
.f textarea { resize: vertical; min-height: 84px; }
.two { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.actions .spacer { margin-right: auto; }
.err { color: var(--no); font-size: 13px; min-height: 18px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 32px); }
@media (max-width: 480px) { .rows dt { width: 100%; } .st { width: 84px; } }

/* weich, rund, leicht */
.panel { border-radius: 26px; }
.big { padding: 8px; gap: 6px; }
.big > div { border-radius: 20px; padding: 12px 16px; }
.big > div + div { border-left: 0; }
.big .first { border-radius: 20px; }
.rows { border-top: 0; padding: 0 22px 6px; }
.rows > div + div { border-top: 1px solid var(--line); }
.foot { padding: 0 22px 16px; }
header .eyebrow { font-weight: 500; letter-spacing: 0.22em; }
.search input { border-radius: 99px; padding: 0 20px; height: 46px; background: var(--surface); box-shadow: var(--soft); border-color: transparent; }
.seg { border-radius: 99px; padding: 3px; gap: 2px; border-color: transparent; box-shadow: var(--soft); }
.seg button { border-radius: 99px; height: 38px; padding: 0 18px; }
.seg button + button { border-left: 0; }
.btn { border-radius: 99px; height: 46px; padding: 0 22px; font-weight: 500; }
.btn.small { height: 36px; }
.chip { border-radius: 99px; height: 36px; padding: 0 15px; border-color: transparent; box-shadow: var(--soft); }
.chip[aria-pressed="true"] { box-shadow: none; }
.tile { border-radius: 26px; border-color: transparent; box-shadow: var(--soft); overflow: hidden; }
.tile:hover { border-color: var(--line); }
.tile.is-open { border-color: transparent; }
.grid { gap: 12px; }
.t-head { padding: 16px 10px 16px 20px; gap: 8px; }
.t-main { gap: 6px; }
.nm { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; padding: 1px 0; }
.addr { font-size: 12px; }
.chev { width: 34px; height: 34px; border-radius: 50%; background: var(--sunk); }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dots { gap: 4px; margin-top: 3px; }
.t-body { padding: 4px 16px 18px; border-top: 0; gap: 10px; }
.t-sum { padding-left: 4px; }
.d { border-radius: 20px; padding: 14px 16px; gap: 4px; background: var(--sunk); }
.d-name { font-family: var(--display); font-weight: 400; font-size: 22px; }
.d-note { border-radius: 14px; padding: 7px 12px; }
.note-box { border-radius: 14px; padding: 9px 14px; }
.st { border-radius: 99px; font-weight: 500; }
.edit-link { padding-top: 6px; }
.place-head { border-bottom: 1px solid var(--line); }
.place-head h2 { font-size: 40px; font-weight: 400; }
.notice, .empty.panel { border-radius: 20px; }
.sheet { border-radius: 30px 30px 0 0; padding: 22px 20px; }
@media (min-width: 700px) { .sheet { border-radius: 30px; } }
.f input[type="text"], .f input[type="number"], .f input[type="email"], .f input[type="password"], .f select, .f textarea { border-radius: 16px; border-color: var(--line); background: var(--sunk); padding: 10px 14px; }
.sheet h2 { font-size: 32px; }
.toast { border-radius: 99px; padding: 10px 20px; }

/* Spalten und Animation */
.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dgrid { grid-template-columns: 1fr; }
.wide-tile .dgrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.d-top { flex-wrap: wrap; }
.d-name { flex: 1 1 auto; }
.d-line { flex-wrap: wrap; gap: 0 8px; }
.tile { transition: box-shadow .35s ease, transform .35s cubic-bezier(.22, .8, .24, 1), border-color .2s; }
@media (hover: hover) { .tile:hover { transform: translateY(-2px); } }
.t-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.22, .8, .24, 1); }
.tile.is-open > .t-collapse { grid-template-rows: 1fr; }
.t-inner { min-height: 0; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .4s; }
.tile.is-open > .t-collapse > .t-inner { opacity: 1; visibility: visible; transition: opacity .4s ease .1s, visibility 0s; }
.chev { transition: background .25s ease; }
.chev[aria-expanded="true"] { background: var(--accent); }
.chev[aria-expanded="true"] .arr { border-color: var(--on-accent); }
.arr { transition: transform .4s cubic-bezier(.22, .8, .24, 1), border-color .25s; }
.st, .chip, .btn, .seg button { transition: background .2s ease, color .2s ease, transform .15s ease; }
.st:active, .chip:active, .btn:active { transform: scale(0.96); }
@keyframes swap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#list.swap { animation: swap-in .4s cubic-bezier(.22, .8, .24, 1) both; }
@keyframes veil-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes veil-out { to { opacity: 0; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(28px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(18px) scale(0.98); } }
.veil { animation: veil-in .25s ease both; }
.sheet { animation: sheet-in .35s cubic-bezier(.22, .8, .24, 1) both; }
.veil.out { animation: veil-out .19s ease both; pointer-events: none; }
.veil.out .sheet { animation: sheet-out .19s ease both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
}

/* Glas-Popup für die Haushalts-Details */
.veil.glass { align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: transparent; }
.veil.glass::before { content: ""; position: absolute; inset: 0; background: var(--veil); -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15); }
.veil.glass .sheet { position: relative; z-index: 1; max-width: 840px; max-height: min(100%, 900px); border-radius: 36px; padding: 30px 28px; gap: 18px;

  /* ---------- Lokaler Speicher (nur Notfall ohne Cloud) ---------- */
  var LOCAL_KEY = 'gaesteliste-nicola-vanessa-v1';
  function makeLocalDb() {
    var KEY = LOCAL_KEY, data = null, subs = { guests: [], notes: [], budget: [], settings: [], tables: [], tasks: [], seats: [] };
    try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
    if (!data) data = {};
    ['guests', 'notes', 'budget', 'settings', 'tables', 'tasks', 'seats'].forEach(function (c) { if (!data[c]) data[c] = {}; });
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
    function snap(c) {
      var ids = Object.keys(data[c]).sort();
      return { docs: ids.map(function (id) { return { id: id, data: function () { return JSON.parse(JSON.stringify(data[c][id])); } }; }) };
    }
    function fire(c) { subs[c].forEach(function (fn) { fn(snap(c)); }); }
    function coll(c) {
      return {
        doc: function (id) {
          return {
            set: function (d) { data[c][id] = d; persist(); fire(c); return Promise.resolve(); },
            update: function (p) { data[c][id] = Object.assign({}, data[c][id], p); persist(); fire(c); return Promise.resolve(); },
            delete: function () { delete data[c][id]; persist(); fire(c); return Promise.resolve(); }
          };
        },
        onSnapshot: function (next) { subs[c].push(next); setTimeout(function () { next(snap(c)); }, 0); return function () {}; }
      };
    }
    return { collection: coll, doc: function (path) { var p = path.split('/'); return coll(p[0]).doc(p[1]); } };
  }

  /* ---------- Firebase (Cloud-Speicher, Anmeldung, Rollen) ---------- */
  var FB_CONFIG = {
    apiKey: "AIzaSyDnNQPXPoEKZ3nh8bqJT3We4w_UdDKbgDo",
    authDomain: "wedding-7176e.firebaseapp.com",
    projectId: "wedding-7176e",
    storageBucket: "wedding-7176e.firebasestorage.app",
    messagingSenderId: "4899299305",
    appId: "1:4899299305:web:7234ccd5c0b3a41c817578",
    measurementId: "G-9SZG1X6CGK"
  };
  var FB_BASE = 'https://www.gstatic.com/firebasejs/10.14.1/';
  var MAIL_DOMAIN = '@gaesteliste.invalid';
  var ADMINS = ['nicola' + MAIL_DOMAIN, 'vanessa' + MAIL_DOMAIN];
  var SUPER = 'nicola' + MAIL_DOMAIN;
  function isSuper() { return !!(authUser && String(authUser.email || '').toLowerCase() === SUPER); }
  var fs = null, cloud = false, authUser = null, unsubs = [];
  var syncEl = document.getElementById('sync');
  function isAdmin() { return !cloud || !!(authUser && ADMINS.indexOf(String(authUser.email || '').toLowerCase()) > -1); }
  function niceName() { var n = String((authUser && authUser.email) || '').split('@')[0]; return n.charAt(0).toUpperCase() + n.slice(1); }
  function setSync(kind, text, onclick) {
    syncEl.hidden = false; syncEl.setAttribute('data-k', kind); syncEl.textContent = text;
    syncEl.onclick = onclick || null; syncEl.disabled = !onclick;
  }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement('script'); el.src = src; el.async = false;
      var t = setTimeout(function () { rej(new Error('timeout')); }, 10000);
      el.onload = function () { clearTimeout(t); res(); };
      el.onerror = function () { clearTimeout(t); rej(new Error('load')); };
      document.head.appendChild(el);
    });
  }
  function denied(e) { return !!e && (e.code === 'permission-denied' || e.code === 'unauthenticated'); }
  function stopAll() { unsubs.forEach(function (f) { try { f(); } catch (e) {} }); unsubs = []; }
  function toMail(name) { var n = String(name || '').trim().toLowerCase(); return n.indexOf('@') > -1 ? n : n + MAIL_DOMAIN; }
  function authMsg(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email') return 'Benutzername oder Passwort stimmt nicht.';
    if (c === 'auth/too-many-requests') return 'Zu viele Versuche. Bitte später erneut versuchen.';
    if (c === 'auth/operation-not-allowed') return 'Die Anmeldung mit E-Mail und Passwort ist in Firebase noch nicht aktiviert.';
    if (c === 'auth/network-request-failed') return 'Keine Verbindung zum Internet.';
    return 'Anmeldung nicht möglich (' + (c || 'unbekannt') + ').';
  }
  function diffText(a, b) {
    var out = [];
    Object.keys(b).forEach(function (k) {
      if (k === 'order') return;
      var x = JSON.stringify(a[k] === undefined ? '' : a[k]), y = JSON.stringify(b[k]);
      if (x !== y) out.push(k + ': ' + String(a[k] === undefined || a[k] === '' ? '\u2013' : a[k]) + ' \u2192 ' + String(b[k] === '' ? '\u2013' : b[k]));
    });
    return out.length ? ' (' + out.join('; ') + ')' : '';
  }
  function logChange(text) {
    if (!cloud || !fs || !authUser ) return;
    try { fs.collection('log').add({ t: Date.now(), u: niceName(), x: String(text).slice(0, 400) }).catch(function () {}); } catch (e) {}
  }
  function renderLog(snap) {
    var rows = snap.docs.map(function (d) { return d.data() || {}; });
    var box = document.getElementById('log-list');
    put(box, [h('section', { class: 'panel' }, rows.length ? rows.map(function (r) {
      return h('div', { class: 'l-item' },
        h('span', { class: 'l-t', text: new Date(r.t).toLocaleString('de-CH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) }),
        h('span', { class: 'l-u', text: r.u || '' }),
        h('span', { text: r.x || '' }));
    }) : h('div', { class: 'l-item' }, h('span', { text: 'Noch keine \u00c4nderungen.' })))]);
  }
  function applyRole() {
    var admin = isAdmin();
    window.__ro = !admin; document.body.classList.toggle('ro', !admin);
    document.getElementById('m-log').hidden = !isSuper();
    document.getElementById('m-budget').hidden = !admin;
    document.getElementById('export').hidden = !admin;
    if (!admin && mode === 'budget') setMode('gaeste', false);

  }
  function whoami() { return niceName(); }
  function openLogin() {
    if (document.getElementById('l-user')) return;
    var user = h('input', { type: 'text', id: 'l-user', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', placeholder: 'z. B. Nicola' });
    var pw = h('input', { type: 'password', id: 'l-pw', autocomplete: 'current-password' });
    var err = h('div', { class: 'err', role: 'alert' });
    var sheet = h('form', { class: 'sheet', onsubmit: function (e) {
      e.preventDefault(); err.textContent = '';
      firebase.auth().signInWithEmailAndPassword(toMail(user.value), pw.value).then(function () { closeSheet(); }, function (ex) { err.textContent = authMsg(ex); });
    } },
      h('h2', { text: 'Anmelden' }),
      h('p', { class: 'hint', text: 'Die Gästeliste ist geschützt. Bitte mit Benutzername und Passwort anmelden.' }),
      fld('l-user', 'Benutzername', user), fld('l-pw', 'Passwort', pw), err,
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn', onclick: closeSheet, text: 'Später' }),
        h('button', { type: 'submit', class: 'btn primary', text: 'Anmelden' })));
    openSheet(sheet, {});
  }
  function needLogin() {
    stopAll();
    guests = []; notes = {}; budget = []; tables = []; tasks = []; seats = {}; cfg = { hochzeit: 0, gesamt: 0 };
    applyRole();
    setSync('warn', 'Nicht angemeldet', openLogin);

  }
  function signOutTwoStep() {
    if (!syncEl.getAttribute('data-armed')) {
      syncEl.setAttribute('data-armed', '1'); var old = syncEl.textContent; syncEl.textContent = 'Abmelden?';
      setTimeout(function () { if (syncEl.getAttribute('data-armed')) { syncEl.removeAttribute('data-armed'); syncEl.textContent = old; } }, 3500);
      return;
    }
    syncEl.removeAttribute('data-armed'); firebase.auth().signOut();
  }
  function onErr(e) {
    if (denied(e)) {
      if (authUser) { setSync('warn', 'Kein Zugriff', signOutTwoStep); fail('Kein Zugriff. Die Firestore-Regeln erlauben diesem Benutzer den Zugriff nicht.'); }
      else needLogin();
      return;
    }
    var msg = String((e && (e.message || e.code)) || '');
    if (e && e.code === 'unavailable') return;
    setSync('warn', 'Keine Verbindung', authUser ? signOutTwoStep : null);
    if (/does not exist|not-found/i.test(msg)) fail('Die Firestore-Datenbank ist noch nicht erstellt. In der Firebase-Konsole unter «Firestore Database» auf «Datenbank erstellen» klicken.');
    else fail('Die Cloud-Verbindung ist fehlgeschlagen (' + ((e && e.code) || 'unbekannt') + ').');
  }
  function softErr(e) { if (denied(e) && authUser) { rulesHint = true; render(); } }
  function connect() {
    stopAll();
    unsubs.push(fs.collection('notes').onSnapshot(onNotes, onErr));
    unsubs.push(fs.collection('guests').onSnapshot(onGuests, onErr));
    unsubs.push(fs.collection('tables').onSnapshot(onTables, softErr));
    unsubs.push(fs.collection('tasks').onSnapshot(onTasks, softErr));
    unsubs.push(fs.collection('seats').onSnapshot(onSeats, softErr));
    if (isSuper()) unsubs.push(fs.collection('log').orderBy('t', 'desc').limit(300).onSnapshot(renderLog, function () {}));
    if (isAdmin()) {
      unsubs.push(fs.collection('budget').onSnapshot(onBudget, onErr));
      unsubs.push(fs.collection('settings').onSnapshot(onSettings, onErr));
    }
    document.getElementById('notice').hidden = true;
    setSync('ok', 'Cloud · ' + niceName() + (isSuper() ? ' · Admin+' : isAdmin() ? ' · Admin' : ' · Leser'), signOutTwoStep);
  }
  function startCloud() {
    return loadScript(FB_BASE + 'firebase-app-compat.js')
      .then(function () { return loadScript(FB_BASE + 'firebase-firestore-compat.js'); })
      .then(function () { return loadScript(FB_BASE + 'firebase-auth-compat.js'); })
      .then(function () {
        firebase.initializeApp(FB_CONFIG);
        fs = firebase.firestore();
        return fs.enablePersistence({ synchronizeTabs: true }).catch(function () {});
      })
      .then(function () {
        cloud = true; db = fs;
        setSync('busy', 'Verbinde …');
        firebase.auth().onAuthStateChanged(function (u) {
          authUser = u;
          if (u) { applyRole(); connect(); } else { needLogin(); }
        });
        return true;
      }, function () { return false; });
  }
  function fail(msg) { var n = document.getElementById('notice'); n.textContent = msg; n.hidden = false; loaded = true; bLoaded = true; render(); }
  function skipCache(snap) { return !!(snap.metadata && snap.metadata.fromCache && snap.empty); }
  function onNotes(snap) { notes = {}; snap.docs.forEach(function (d) { var t = (d.data() || {}).text; if (t) notes[d.id] = t; }); if (loaded) render(); }
  function onGuests(snap) { if (skipCache(snap)) return; guests = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }); loaded = true; render(); }
  function onBudget(snap) { if (skipCache(snap)) return; budget = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }); bLoaded = true; render(); }
  function onTables(snap) { tables = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }); rulesHint = false; render(); }
  function onSeats(snap) { seats = {}; snap.docs.forEach(function (d) { seats[d.id] = (d.data() || {}).table || ''; }); render(); }
  function onTasks(snap) { tasks = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }); render(); }
  function onSettings(snap) { snap.docs.forEach(function (d) { if (d.id === 'budget') { var o = d.data() || {}; cfg = { hochzeit: Number(o.hochzeit) || 0, gesamt: Number(o.gesamt) || 0 }; } }); render(); }
  startCloud().then(function (ok) {
    if (ok) return;
    db = makeLocalDb();
    db.collection('notes').onSnapshot(onNotes);
    db.collection('guests').onSnapshot(onGuests);
    db.collection('budget').onSnapshot(onBudget);
    db.collection('settings').onSnapshot(onSettings);
    db.collection('tables').onSnapshot(onTables);
    db.collection('tasks').onSnapshot(onTasks);
    db.collection('seats').onSnapshot(onSeats);
    setSync('local', 'Nur auf diesem Gerät');
  });
})();
